# Netlify configuration.
#
# Kept in the repo rather than the dashboard so the build is reproducible and
# reviewable. Settings here override the UI, which also means a stale dashboard
# value cannot quietly break a deploy.

[build]
  # avva builds with Vite, not Parcel. `npm run build` runs `tsc --noEmit`
  # first, so a type error fails the deploy instead of shipping broken output.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # vite, typescript and tsx are all devDependencies, and the build needs every
  # one of them. Netlify installs devDependencies by default, but a NODE_ENV of
  # production anywhere in the environment makes npm skip them — and the failure
  # is a bare "vite: command not found" that looks nothing like its cause.
  NPM_FLAGS = "--include=dev"

# No SPA catch-all on purpose.
#
# avva is a static two-page site, not a single-page app. The views are query
# strings (/?view=loop) rather than paths, so they already resolve to
# dist/index.html on their own, and /controller/ is a real directory with its
# own index.html. A rewrite of /* to /index.html would break the controller by
# serving the launcher in its place.

[[headers]]
  for = "/*"
  [headers.values]
    # The camera, showDirectoryPicker and AudioWorklet all require a secure
    # context, which HTTPS gives. This just stops a downgrade.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
